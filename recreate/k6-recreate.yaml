
apiVersion: v1
kind: ConfigMap
metadata:
  name: recreate-demo-k6-script
data:
  script.js: |
    import http from 'k6/http';
    import { check, sleep } from 'k6';

    export const options = {
      vus: 20,
      duration: '15m',
    };

    export default function () {
      const page = http.get('http://recreate-demo-service/');

      check(page, {
        'HTML page status is 200': (response) =>
          response.status === 200,
      });

      const health = http.get(
        'http://recreate-demo-service/health'
      );

      check(health, {
        'application is healthy': (response) =>
          response.status === 200,
      });

      sleep(0.5);
    }
---
apiVersion: batch/v1
kind: Job
metadata:
  name: recreate-demo-k6-run
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 1200
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: k6
          image: grafana/k6:latest
          command:
            - k6
            - run
            - -o
            - experimental-prometheus-rw
            - /scripts/script.js
          env:
            - name: K6_PROMETHEUS_RW_SERVER_URL
              value: http://prometheus:9090/api/v1/write
          volumeMounts:
            - name: k6-script
              mountPath: /scripts
      volumes:
        - name: k6-script
          configMap:
            name: recreate-demo-k6-script
