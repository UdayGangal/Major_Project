global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  # ROLLING UPDATE
  - job_name: rolling-demo
    kubernetes_sd_configs:
      - role: pod
    relabel_configs:
      - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_scrape]
        action: keep
        regex: "true"

      - source_labels: [__meta_kubernetes_pod_label_app]
        action: keep
        regex: rolling-demo

      - source_labels: [__meta_kubernetes_pod_label_version]
        action: drop
        regex: blue|green

      - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_path]
        action: replace
        target_label: __metrics_path__
        regex: (.+)

      - source_labels: [__address__, __meta_kubernetes_pod_annotation_prometheus_io_port]
        action: replace
        target_label: __address__
        regex: (.+):[0-9]+;([0-9]+)
        replacement: $1:$2

      - source_labels: [__meta_kubernetes_pod_name]
        target_label: pod

      - target_label: strategy
        replacement: rolling

  # BLUE-GREEN
  - job_name: blue-green-demo
    kubernetes_sd_configs:
      - role: pod
    relabel_configs:
      - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_scrape]
        action: keep
        regex: "true"

      - source_labels: [__meta_kubernetes_pod_label_app]
        action: keep
        regex: blue-green-demo

      - source_labels: [__meta_kubernetes_pod_label_version]
        action: keep
        regex: blue|green

      - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_path]
        action: replace
        target_label: __metrics_path__
        regex: (.+)

      - source_labels: [__address__, __meta_kubernetes_pod_annotation_prometheus_io_port]
        action: replace
        target_label: __address__
        regex: (.+):[0-9]+;([0-9]+)
        replacement: $1:$2

      - source_labels: [__meta_kubernetes_pod_name]
        target_label: pod

      - source_labels: [__meta_kubernetes_pod_label_version]
        target_label: deployment_color

      - target_label: strategy
        replacement: blue-green

  # RECREATE
  - job_name: recreate-demo
    kubernetes_sd_configs:
      - role: pod
    relabel_configs:
      - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_scrape]
        action: keep
        regex: "true"

      - source_labels: [__meta_kubernetes_pod_label_app]
        action: keep
        regex: recreate-demo

      - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_path]
        action: replace
        target_label: __metrics_path__
        regex: (.+)

      - source_labels: [__address__, __meta_kubernetes_pod_annotation_prometheus_io_port]
        action: replace
        target_label: __address__
        regex: (.+):[0-9]+;([0-9]+)
        replacement: $1:$2

      - source_labels: [__meta_kubernetes_pod_name]
        target_label: pod

      - target_label: strategy
        replacement: recreate

  # CANARY
  - job_name: canary-demo
    kubernetes_sd_configs:
      - role: pod
    relabel_configs:
      - source_labels: [__meta_kubernetes_namespace]
        action: keep
        regex: canary

      - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_scrape]
        action: keep
        regex: "true"

      - source_labels: [__meta_kubernetes_pod_label_app]
        action: keep
        regex: canary-demo

      - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_path]
        action: replace
        target_label: __metrics_path__
        regex: (.+)

      - source_labels: [__address__, __meta_kubernetes_pod_annotation_prometheus_io_port]
        action: replace
        target_label: __address__
        regex: (.+):[0-9]+;([0-9]+)
        replacement: $1:$2

      - source_labels: [__meta_kubernetes_pod_name]
        target_label: pod

      - source_labels: [__meta_kubernetes_pod_label_version]
        target_label: version

      - target_label: strategy
        replacement: canary

