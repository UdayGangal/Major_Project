apiVersion: v1
kind: ConfigMap
metadata:
  name: rolling-demo-k6-script
data:
  script.js: |
    import http from 'k6/http';
    import { check, sleep } from 'k6';

    export const options = {
      stages: [
        { duration: '10s', target: 10 },
        { duration: '30s', target: 25 },
        { duration: '30s', target: 50 },
        { duration: '10s', target: 0 },
      ],

      thresholds: {
        http_req_failed: ['rate<0.01'],
        http_req_duration: ['p(95)<500'],
      },
    };

    export default function () {
      const response = http.get(
        'http://rolling-demo-service.default.svc.cluster.local/version'
      );

      check(response, {
        'status is 200': (r) => r.status === 200,
        'version is v1': (r) =>
          r.status === 200 && r.body.includes('"version":"v1"'),
      });

      sleep(0.1);
    }

---
apiVersion: batch/v1
kind: Job
metadata:
  name: rolling-demo-k6
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 180

  template:
    spec:
      restartPolicy: Never

      containers:
        - name: k6
          image: grafana/k6:latest
          command:
            - k6
            - run
            - /scripts/script.js

          volumeMounts:
            - name: k6-script
              mountPath: /scripts

      volumes:
        - name: k6-script
          configMap:
            name: rolling-demo-k6-script