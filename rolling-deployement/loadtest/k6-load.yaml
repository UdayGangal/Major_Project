apiVersion: v1
kind: ConfigMap
metadata:
  name: rolling-demo-k6-script
data:
  script.js: |
    import http from 'k6/http';
    import { check, sleep } from 'k6';

    export const options = {
      vus: 20,
      duration: '15m',
    };

    export default function () {
      const page = http.get('http://rolling-demo-service/');

      check(page, {
        'HTML page status is 200': (response) => response.status === 200,
      });

      const health = http.get('http://rolling-demo-service/health');

      check(health, {
        'application is healthy': (response) => response.status === 200,
      });

      sleep(0.5);
    }

---
apiVersion: batch/v1
kind: Job
metadata:
  name: rolling-demo-k6
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 180

  template:
    spec:
      restartPolicy: Never

      containers:
        - name: k6
          image: grafana/k6:latest
          command:
            - k6
            - run
            - /scripts/script.js

          volumeMounts:
            - name: k6-script
              mountPath: /scripts

      volumes:
        - name: k6-script
          configMap:
            name: rolling-demo-k6-script
