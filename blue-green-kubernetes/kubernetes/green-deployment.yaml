
apiVersion: apps/v1
kind: Deployment
metadata:
  name: green-deployment

spec:
  replicas: 4

  selector:
    matchLabels:
      app: blue-green-demo
      version: green

  template:
    metadata:
      labels:
        app: blue-green-demo
        version: green

      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: "/metrics"
        prometheus.io/port: "5000"

    spec:
      containers:
        - name: green-app
          image: shonnnttyyy/blue-green-demo:green-v2
          imagePullPolicy: Always

          ports:
            - name: http
              containerPort: 5000

          readinessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 3
            periodSeconds: 5

          livenessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 10
            periodSeconds: 10

          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"
